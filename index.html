<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資リスク許容度診断クイズ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-50 min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-8">
  <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">投資リスク許容度診断</h1>
    <p class="text-gray-500 text-sm">10問の質問であなたの投資家タイプを判定します</p>
  </div>

  <!-- Quiz -->
  <div id="quiz-section">
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-4">
      <div class="flex justify-between items-center mb-4">
        <span class="text-sm text-gray-500">質問 <span id="q-num">1</span> / 10</span>
        <div class="w-40 bg-gray-200 rounded-full h-2">
          <div id="q-progress" class="bg-emerald-500 h-2 rounded-full transition-all" style="width:10%"></div>
        </div>
      </div>
      <p id="q-text" class="text-gray-800 font-semibold text-base mb-5 leading-relaxed"></p>
      <div id="q-options" class="space-y-2"></div>
      <div class="flex gap-3 mt-6">
        <button onclick="prevQ()" id="btn-prev" aria-label="前の質問に戻る" class="flex-1 py-2 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold hover:bg-gray-50 transition" disabled>◀ 前へ</button>
        <button onclick="nextQ()" id="btn-next" aria-label="次の質問へ進む" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 transition" disabled>次へ ▶</button>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div id="result-section" class="hidden">
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 text-center">
      <div id="type-icon" class="text-6xl mb-3"></div>
      <h2 id="type-name" class="text-2xl font-bold mb-1"></h2>
      <p id="type-score" class="text-gray-500 text-sm mb-3"></p>
      <p id="type-desc" class="text-gray-700 text-sm leading-relaxed"></p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
      <h3 class="text-lg font-bold text-gray-800 mb-4">推奨ポートフォリオ配分</h3>
      <svg id="pie-svg" viewBox="0 0 320 240" class="w-full max-w-xs mx-auto block" aria-label="推奨ポートフォリオ円グラフ"></svg>
      <div id="alloc-legend" class="grid grid-cols-2 gap-2 mt-4"></div>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
      <h3 class="text-lg font-bold text-gray-800 mb-2">タイプの特徴・注意点</h3>
      <div id="type-detail" class="space-y-3 text-sm text-gray-700"></div>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
      <h3 class="text-lg font-bold text-gray-800 mb-2">推奨商品カテゴリ</h3>
      <div id="product-list" class="flex flex-wrap gap-2"></div>
    </div>

    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-xs text-amber-800">
      ⚠️ この診断は教育目的のみです。実際の投資判断は金融機関・ファイナンシャルプランナー等の専門家にご相談ください。
    </div>

    <button onclick="resetQuiz()" aria-label="もう一度診断する" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 transition">もう一度診断</button>
  </div>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const QUESTIONS = [
  {text:'現在の年齢はどれですか？',opts:[{l:'20〜30代',v:5},{l:'40代',v:4},{l:'50代',v:3},{l:'60代',v:2},{l:'70代以上',v:1}]},
  {text:'投資の目的は何ですか？',opts:[{l:'老後の資産形成（20年以上先）',v:5},{l:'10〜20年後の大きな目標',v:4},{l:'5〜10年後の目標',v:3},{l:'3〜5年以内の目標',v:2},{l:'1〜2年以内の短期',v:1}]},
  {text:'現在の収入に対する貯蓄率はどのくらいですか？',opts:[{l:'30%以上',v:5},{l:'20〜30%',v:4},{l:'10〜20%',v:3},{l:'5〜10%',v:2},{l:'5%未満',v:1}]},
  {text:'投資に回せる資金は生活費の何ヶ月分の余裕資金ですか？',opts:[{l:'12ヶ月以上',v:5},{l:'6〜12ヶ月',v:4},{l:'3〜6ヶ月',v:3},{l:'1〜3ヶ月',v:2},{l:'1ヶ月未満',v:1}]},
  {text:'投資経験はありますか？',opts:[{l:'10年以上（株・FX・仮想通貨等）',v:5},{l:'5〜10年（投信・株）',v:4},{l:'2〜5年（投信程度）',v:3},{l:'1〜2年（少額経験あり）',v:2},{l:'ほぼなし',v:1}]},
  {text:'保有資産が30%下落した場合の感情反応は？',opts:[{l:'買い増しチャンスと判断して追加投資',v:5},{l:'動揺しつつも保有継続',v:4},{l:'一部売却を検討',v:3},{l:'半分以上を売却',v:2},{l:'全て売却してしまう',v:1}]},
  {text:'投資先が一時的に50%下落しても保有し続けられますか？',opts:[{l:'余裕で続けられる',v:5},{l:'おそらく続けられる',v:4},{l:'かなり辛いが続ける',v:3},{l:'おそらく売却する',v:2},{l:'確実に売却する',v:1}]},
  {text:'あなたにとってリスク（損失可能性）とリターンの関係は？',opts:[{l:'高リスク高リターンを積極的に追求',v:5},{l:'ある程度のリスクを取ってリターンを追求',v:4},{l:'リスク・リターンのバランス重視',v:3},{l:'低リスクで安定したリターンを重視',v:2},{l:'元本割れは絶対に避けたい',v:1}]},
  {text:'現在の家族・生活状況は？',opts:[{l:'独身・扶養なし・住宅ローンなし',v:5},{l:'独身・または共働きで安定',v:4},{l:'既婚・子供あり・ローンあり',v:3},{l:'高齢の扶養家族がいる',v:2},{l:'医療費等の大きな支出リスクあり',v:1}]},
  {text:'投資でどの程度の年間リターンを期待しますか？',opts:[{l:'15%以上',v:5},{l:'10〜15%',v:4},{l:'5〜10%',v:3},{l:'2〜5%',v:2},{l:'元本維持（リターン不問）',v:1}]},
];

const TYPES = [
  {min:46, name:'超積極型', icon:'🚀', desc:'高いリスク許容度を持ち、長期的な資産成長を最優先します。市場の変動を機会と捉えられる強いメンタルが必要。',
   alloc:{股:'80', bond:'10', cash:'5', commodity:'5'},
   colors:['#6366F1','#34D399','#FCD34D','#F97316'],
   points:['長期保有（10年超）が前提','分散投資でも高リスク資産中心','急落時に追加投資できるキャッシュを確保'],
   products:['インデックス投信（全世界株）','個別株','新興国株ETF','REITs','仮想通貨（少額）']},
  {min:37, name:'積極型', icon:'📈', desc:'リスクを理解した上で積極的なリターンを追求します。株式中心のポートフォリオが適しています。',
   alloc:{股:'65', bond:'20', cash:'10', commodity:'5'},
   colors:['#6366F1','#34D399','#FCD34D','#F97316'],
   points:['株式比率を高めに設定','毎月一定額の積立投資が有効','年1回リバランスを実施'],
   products:['インデックス投信（全世界・S&P500）','先進国株ETF','高配当株','J-REIT']},
  {min:27, name:'バランス型', icon:'⚖️', desc:'リスクとリターンのバランスを重視します。株式と債券を組み合わせた安定成長を目指します。',
   alloc:{股:'50', bond:'35', cash:'10', commodity:'5'},
   colors:['#6366F1','#34D399','#FCD34D','#F97316'],
   points:['株式と債券の組み合わせで安定性を確保','年1〜2回のリバランスで比率を維持','景気変動に左右されにくい分散投資'],
   products:['バランス型投信','先進国株ETF','国内外債券ファンド','個人向け国債']},
  {min:18, name:'保守型', icon:'🛡️', desc:'元本保全を重視し、リスクを最小限に抑えます。安定した収益を優先するスタイルです。',
   alloc:{股:'25', bond:'50', cash:'20', commodity:'5'},
   colors:['#6366F1','#34D399','#FCD34D','#F97316'],
   points:['債券・預金中心のポートフォリオ','元本割れリスクの低い商品を選択','インフレリスクへの備えも必要'],
   products:['個人向け国債','定期預金','債券型投信','MMF','低リスクバランス投信']},
  {min:0,  name:'超保守型', icon:'🏦', desc:'元本の安全性を最優先します。投資損失を極力避け、現金・預金中心の資産管理が適しています。',
   alloc:{股:'10', bond:'40', cash:'45', commodity:'5'},
   colors:['#6366F1','#34D399','#FCD34D','#F97316'],
   points:['元本割れのリスクは受け入れ不可','預金・国債中心で管理','少額からでも分散してリスクを意識'],
   products:['銀行預金（定期・普通）','個人向け国債（変動10年）','MRF','元本確保型保険']}
];

const ALLOC_LABELS = {股:'株式',bond:'債券',cash:'現金',commodity:'コモディティ'};

let answers = new Array(10).fill(null);
let currentQ = 0;

function getType(score){ return TYPES.find(t=>score>=t.min)||TYPES[TYPES.length-1]; }
function calcScore(){ return answers.reduce((s,v)=>s+(v||0),0); }

function renderQ(){
  const q=QUESTIONS[currentQ];
  document.getElementById('q-num').textContent=currentQ+1;
  document.getElementById('q-progress').style.width=((currentQ+1)/10*100)+'%';
  document.getElementById('q-text').textContent=q.text;
  const opts=document.getElementById('q-options');
  opts.innerHTML='';
  q.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.setAttribute('aria-label',opt.l);
    const sel=answers[currentQ]===opt.v;
    btn.className='w-full text-left px-4 py-3 rounded-xl border-2 transition font-medium text-sm '+(sel?'border-emerald-500 bg-emerald-50 text-emerald-800':'border-gray-200 hover:border-emerald-300 hover:bg-emerald-50 text-gray-700');
    btn.textContent=opt.l;
    btn.onclick=()=>{ answers[currentQ]=opt.v; renderQ(); };
    opts.appendChild(btn);
  });
  document.getElementById('btn-prev').disabled=currentQ===0;
  document.getElementById('btn-next').disabled=answers[currentQ]===null;
  document.getElementById('btn-next').textContent=currentQ===9?'診断する ✨':'次へ ▶';
}

function nextQ(){
  if(answers[currentQ]===null) return;
  if(currentQ===9){ showResult(); return; }
  currentQ++;
  renderQ();
}

function prevQ(){ if(currentQ>0){ currentQ--; renderQ(); } }

function drawPie(type){
  const keys=['股','bond','cash','commodity'];
  const vals=keys.map(k=>parseInt(type.alloc[k]));
  const total=vals.reduce((s,v)=>s+v,0);
  const cx=120, cy=110, r=90;
  let startAngle=-Math.PI/2;
  let paths='';
  vals.forEach((v,i)=>{
    const angle=(v/total)*Math.PI*2;
    const endAngle=startAngle+angle;
    const x1=cx+Math.cos(startAngle)*r, y1=cy+Math.sin(startAngle)*r;
    const x2=cx+Math.cos(endAngle)*r, y2=cy+Math.sin(endAngle)*r;
    const lf=angle>Math.PI?1:0;
    paths+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${lf} 1 ${x2} ${y2} Z" fill="${type.colors[i]}" opacity="0.85" stroke="white" stroke-width="2"/>`;
    // Label
    const midAngle=startAngle+angle/2;
    if(v>=8){
      const lx=cx+Math.cos(midAngle)*r*0.65, ly=cy+Math.sin(midAngle)*r*0.65;
      paths+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="bold" fill="white">${escHtml(vals[i]+'%')}</text>`;
    }
    startAngle=endAngle;
  });
  document.getElementById('pie-svg').innerHTML=paths;
  const legend=document.getElementById('alloc-legend');
  legend.innerHTML=keys.map((k,i)=>`<div class="flex items-center gap-2 text-sm"><span class="inline-block w-3 h-3 rounded-full" style="background:${type.colors[i]}"></span><span class="text-gray-600">${escHtml(ALLOC_LABELS[k])}</span><span class="font-bold text-gray-800 ml-auto">${escHtml(type.alloc[k]+'%')}</span></div>`).join('');
}

function showResult(){
  const score=calcScore();
  const type=getType(score);
  document.getElementById('quiz-section').classList.add('hidden');
  document.getElementById('result-section').classList.remove('hidden');
  document.getElementById('type-icon').textContent=type.icon;
  document.getElementById('type-name').textContent=type.name;
  document.getElementById('type-score').textContent='スコア: '+score+' / 50点';
  document.getElementById('type-desc').textContent=type.desc;
  drawPie(type);
  document.getElementById('type-detail').innerHTML=type.points.map(p=>`<div class="flex gap-2"><span class="text-emerald-500 font-bold">•</span><span>${escHtml(p)}</span></div>`).join('');
  document.getElementById('product-list').innerHTML=type.products.map(p=>`<span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold">${escHtml(p)}</span>`).join('');
  localStorage.setItem('risk-tolerance-2026', JSON.stringify({score, typeName:type.name, answers}));
}

function resetQuiz(){
  answers=new Array(10).fill(null);
  currentQ=0;
  document.getElementById('result-section').classList.add('hidden');
  document.getElementById('quiz-section').classList.remove('hidden');
  renderQ();
}

const saved=JSON.parse(localStorage.getItem('risk-tolerance-2026')||'null');
if(saved && saved.answers && saved.answers.length===10){
  answers=saved.answers;
  showResult();
} else {
  renderQ();
}
</script>
</body>
</html>
